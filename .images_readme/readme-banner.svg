<!--
  readme-banner.svg - README header banner for copier-embedded-project
  Shows: title block; one unified project structure with a folder strip; four platform cards (Arduino, bare AVR, ESP, STM32) and their small variations; the device bridge path from a browser board grant to the bench board.
  Intent: identify the repository at the top of README.md and state the one-structure, four-platform promise.
  Theme: Stellars-Tech - teal #0096d1 primary, orange #da8230 accent; light and dark via prefers-color-scheme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-2 { fill: #24697e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .bg-tint { fill: #0096d1; fill-opacity: 0.03; }
    .card { fill: #0096d1; fill-opacity: 0.04; stroke: #0096d1; stroke-width: 1; }
    .container { fill: #0096d1; fill-opacity: 0.02; stroke: #0096d1; stroke-width: 0.8; stroke-opacity: 0.25; }
    .chip { fill: #0096d1; fill-opacity: 0.05; stroke: #0096d1; stroke-width: 0.8; stroke-opacity: 0.25; }
    .branch-fill { fill: #0096d1; }
    .bridge-node { fill: #da8230; fill-opacity: 0.06; stroke: #da8230; stroke-width: 1; stroke-opacity: 0.55; }
    .bridge-path { color: #da8230; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-2 { fill: #8fd4e6; }
      .fg-3 { fill: #5aafc5; }
      .fg-4 { fill: #4099b3; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .bg-tint { fill: #0096d1; fill-opacity: 0.05; }
      .card { fill: #0096d1; fill-opacity: 0.08; stroke: #5cc8e0; stroke-opacity: 0.5; }
      .container { fill-opacity: 0.04; stroke: #5cc8e0; stroke-opacity: 0.35; }
      .chip { fill-opacity: 0.10; stroke: #5cc8e0; stroke-opacity: 0.4; }
      .branch-fill { fill: #5cc8e0; }
      .bridge-node { fill: #da8230; fill-opacity: 0.10; stroke: #d4a04a; stroke-opacity: 0.6; }
      .bridge-path { color: #d4a04a; }
    }
  </style>

  <!-- === GRID REFERENCE ===
    viewBox: 1200 x 300
    Margins: 40 left/right; 30 top; bottom accent bar y=290..300
    Title column: x=40..320 (w=280)
    Diagram column: x=350..1160 (w=810)
    Vertical rhythm: 14px base
    Container: y=30..230; label baseline y=45; chips y=55..75; cards y=95..210
    Cards (w=185, gap=10): x=370, 565, 760, 955
    Chips (w=150, gap=5): x=370, 525, 680, 835, 990
    Bridge: label baseline y=248; nodes y=255..285; arrows on y=270
    Bridge nodes (gap=60): x=350 w=170, x=580 w=150, x=790 w=185, x=1035 w=125
  === -->

  <!-- === LAYOUT TOPOLOGY ===
    contain: structure-container > structure-label, structure-chips, card-arduino, card-avr, card-esp, card-stm32
    h-stack: card-arduino, card-avr, card-esp, card-stm32 (gap=10)
    h-stack: structure-chips (5 chips, gap=5)
    v-align: card tops (y=95), card bottoms (y=210)
    h-align: chip row left = card row left = container padding x=370
    h-stack: bridge-grant, bridge-pty, bridge-upload, bridge-board (gap=60)
    bridge-grant -> bridge-pty -> bridge-upload -> bridge-board (device bridge path, forward)
  === -->

  <defs>
    <pattern id="grid-pat-100" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="red" stroke-width="0.6"/>
    </pattern>
    <pattern id="grid-pat-20" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="red" stroke-width="0.35"/>
    </pattern>
    <pattern id="grid-pat-5" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="red" stroke-width="0.15"/>
    </pattern>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#0096d1"/>
      <stop offset="0.6" stop-color="#0096d1"/>
      <stop offset="1" stop-color="#da8230"/>
    </linearGradient>
  </defs>

  <g id="grid-100" display="none"><rect x="0" y="0" width="1200" height="300" fill="url(#grid-pat-100)"/></g>
  <g id="grid-20" display="none"><rect x="0" y="0" width="1200" height="300" fill="url(#grid-pat-20)"/></g>
  <g id="grid-5" display="none"><rect x="0" y="0" width="1200" height="300" fill="url(#grid-pat-5)"/></g>
  <g id="guide-grid" display="none">
    <line x1="40" y1="0" x2="40" y2="300" stroke="red" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="300" stroke="red" stroke-width="0.5"/>
    <line x1="350" y1="0" x2="350" y2="300" stroke="red" stroke-width="0.5"/>
    <line x1="1160" y1="0" x2="1160" y2="300" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="30" x2="1200" y2="30" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="230" x2="1200" y2="230" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="290" x2="1200" y2="290" stroke="red" stroke-width="0.5"/>
  </g>

  <g id="background">
    <rect x="0" y="0" width="1200" height="300" fill="transparent"/>
    <rect class="bg-tint" x="0" y="0" width="1200" height="300"/>
  </g>

  <g id="nodes">
    <g id="structure-container">
      <path class="container" d="M350.0,30.0 H1160.0 V224.0 Q1160.0,230.0 1154.0,230.0 H356.0 Q350.0,230.0 350.0,224.0 Z"/>
      <rect class="branch-fill" x="350" y="30" width="810" height="4" opacity="0.15"/>
    </g>

    <g id="structure-chips">
      <rect class="chip" x="370" y="55" width="150" height="20" rx="3"/>
      <rect class="chip" x="525" y="55" width="150" height="20" rx="3"/>
      <rect class="chip" x="680" y="55" width="150" height="20" rx="3"/>
      <rect class="chip" x="835" y="55" width="150" height="20" rx="3"/>
      <rect class="chip" x="990" y="55" width="150" height="20" rx="3"/>
    </g>

    <g id="toolchain-pills">
      <rect class="chip" x="505" y="110" width="40" height="16" rx="3"/>
      <rect class="chip" x="700" y="110" width="40" height="16" rx="3"/>
      <rect class="chip" x="895" y="110" width="40" height="16" rx="3"/>
      <rect class="chip" x="1090" y="110" width="40" height="16" rx="3"/>
    </g>

    <g id="card-arduino">
      <path class="card" d="M370.0,95.0 H555.0 V207.0 Q555.0,210.0 552.0,210.0 H373.0 Q370.0,210.0 370.0,207.0 Z"/>
      <rect class="branch-fill" x="370" y="95" width="185" height="5" opacity="0.6"/>
    </g>
    <g id="card-avr">
      <path class="card" d="M565.0,95.0 H750.0 V207.0 Q750.0,210.0 747.0,210.0 H568.0 Q565.0,210.0 565.0,207.0 Z"/>
      <rect class="branch-fill" x="565" y="95" width="185" height="5" opacity="0.6"/>
    </g>
    <g id="card-esp">
      <path class="card" d="M760.0,95.0 H945.0 V207.0 Q945.0,210.0 942.0,210.0 H763.0 Q760.0,210.0 760.0,207.0 Z"/>
      <rect class="branch-fill" x="760" y="95" width="185" height="5" opacity="0.6"/>
    </g>
    <g id="card-stm32">
      <path class="card" d="M955.0,95.0 H1140.0 V207.0 Q1140.0,210.0 1137.0,210.0 H958.0 Q955.0,210.0 955.0,207.0 Z"/>
      <rect class="branch-fill" x="955" y="95" width="185" height="5" opacity="0.6"/>
    </g>

    <g id="bridge-grant">
      <rect class="bridge-node" x="350" y="255" width="170" height="30" rx="15"/>
    </g>
    <g id="bridge-pty">
      <rect class="bridge-node" x="580" y="255" width="150" height="30" rx="15"/>
    </g>
    <g id="bridge-upload">
      <rect class="bridge-node" x="790" y="255" width="190" height="30" rx="15"/>
    </g>
    <g id="bridge-board">
      <rect class="bridge-node" x="1040" y="255" width="120" height="30" rx="15"/>
    </g>
  </g>

  <g id="connectors">
    <g class="bridge-path">
      <!-- straight connector: len=56px start_angle=180.0deg end_angle=0.0deg -->
      <path d="M522.00,270.00 L568.00,270.00" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" stroke-linejoin="round" stroke-linecap="round"/>
      <polygon points="578.00,270.00 568.00,265.00 568.00,275.00" fill="currentColor" opacity="0.6"/>
      <!-- straight connector: len=56px start_angle=180.0deg end_angle=0.0deg -->
      <path d="M732.00,270.00 L778.00,270.00" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" stroke-linejoin="round" stroke-linecap="round"/>
      <polygon points="788.00,270.00 778.00,265.00 778.00,275.00" fill="currentColor" opacity="0.6"/>
      <!-- straight connector: len=56px start_angle=180.0deg end_angle=0.0deg -->
      <path d="M982.00,270.00 L1028.00,270.00" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" stroke-linejoin="round" stroke-linecap="round"/>
      <polygon points="1038.00,270.00 1028.00,265.00 1028.00,275.00" fill="currentColor" opacity="0.6"/>
    </g>
  </g>

  <g id="content">
    <g id="header">
      <text class="accent-1" x="40" y="50" font-size="8" font-weight="600" letter-spacing="1.4">EMBEDDED FIRMWARE TEMPLATE</text>
      <text class="fg-1" x="40" y="75" font-size="19" font-weight="700">copier-embedded-project</text>
      <text class="fg-2" x="40" y="100" font-size="14" font-weight="600">One structure. Four platforms.</text>
      <text class="fg-3" x="40" y="125" font-size="9.5">Same project layout for every supported board family.</text>
      <text class="fg-4" x="40" y="150" font-size="8.5">make env  •  make build  •  make test  •  make sim</text>
      <text class="accent-1" x="40" y="175" font-size="8.5" font-weight="600">copier copy --trust → my-board</text>
      <rect x="0" y="290" width="1200" height="10" fill="url(#accent-bar)" opacity="0.6"/>
    </g>

    <g id="structure-labels">
      <text class="accent-1" x="370" y="45" font-size="8.5" font-weight="600" letter-spacing="1.2">ONE PROJECT STRUCTURE</text>
      <text class="fg-4" x="1140" y="45" font-size="8" text-anchor="end">applies to every platform</text>
      <text class="fg-2" x="445" y="70" font-size="8" text-anchor="middle">src/</text>
      <text class="fg-2" x="600" y="70" font-size="8" text-anchor="middle">test/host</text>
      <text class="fg-2" x="755" y="70" font-size="8" text-anchor="middle">test/harness</text>
      <text class="fg-2" x="910" y="70" font-size="8" text-anchor="middle">Makefile</text>
      <text class="fg-2" x="1065" y="70" font-size="8" text-anchor="middle">resources/envs</text>
    </g>

    <g id="platform-labels">
      <text class="fg-1" x="385" y="125" font-size="12" font-weight="700">Arduino</text>
      <text class="fg-2" x="385" y="145" font-size="8.5">PlatformIO • Uno, Nano, Mega</text>
      <text class="fg-2" x="385" y="160" font-size="8.5">C/C++ core • local lib/</text>
      <text class="fg-3" x="385" y="180" font-size="7.5">src/main.cpp • C host tests</text>
      <text class="accent-1" x="525" y="120" font-size="6.5" font-weight="700" text-anchor="middle">PIO</text>

      <text class="fg-1" x="580" y="125" font-size="12" font-weight="700">Bare AVR</text>
      <text class="fg-2" x="580" y="145" font-size="8.5">avrdude • ATmega + clock</text>
      <text class="fg-2" x="580" y="160" font-size="8.5">no bootloader • simavr</text>
      <text class="fg-3" x="580" y="180" font-size="7.5">src/main.c • simavr boot test</text>
      <text class="accent-1" x="720" y="120" font-size="6.5" font-weight="700" text-anchor="middle">AVR</text>

      <text class="fg-1" x="775" y="125" font-size="12" font-weight="700">ESP</text>
      <text class="fg-2" x="775" y="145" font-size="8.5">ESP-IDF, Arduino, RTOS</text>
      <text class="fg-2" x="775" y="160" font-size="8.5">ESP32 / ESP8266 • QEMU</text>
      <text class="fg-3" x="775" y="180" font-size="7.5">src/main.c • QEMU boot test</text>
      <text class="accent-1" x="915" y="120" font-size="6.5" font-weight="700" text-anchor="middle">ESP</text>

      <text class="fg-1" x="970" y="125" font-size="12" font-weight="700">STM32</text>
      <text class="fg-2" x="970" y="145" font-size="8.5">Rust or PlatformIO</text>
      <text class="fg-2" x="970" y="160" font-size="8.5">ST-Link / serial • QEMU</text>
      <text class="fg-3" x="970" y="180" font-size="7.5">src/main.rs or main.c • host tests</text>
      <text class="accent-1" x="1110" y="120" font-size="6.5" font-weight="700" text-anchor="middle">RUST</text>
    </g>

    <g id="bridge-labels">
      <text class="accent-2" x="350" y="250" font-size="8" font-weight="600" letter-spacing="1.2">DEVICE BRIDGE PATH</text>
      <text class="fg-4" x="1160" y="250" font-size="7.5" text-anchor="end">one pty per attached port</text>
      <text class="fg-1" x="435" y="275" font-size="8.5" text-anchor="middle">Board granted in browser</text>
      <text class="fg-1" x="655" y="275" font-size="8.5" text-anchor="middle">device bridge pty</text>
      <text class="fg-1" x="885" y="275" font-size="8.5" text-anchor="middle">make upload • make monitor</text>
      <text class="fg-1" x="1100" y="275" font-size="8.5" text-anchor="middle">bench board</text>
    </g>
  </g>

  <g id="callouts">
  </g>
</svg>
