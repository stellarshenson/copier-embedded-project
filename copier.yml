# Copier configuration for copier-embedded-project
#
# One project for one embedded platform: Arduino, bare AVR, ESP or STM32.
# The platform question comes first; every later question follows it.
# Optional folders are chosen together through the multiselect `components` answer.

_min_copier_version: "9.6.0"

_subdirectory: template

# Every file in template/ is a Jinja template; there is no .jinja suffix.
_templates_suffix: ""

_jinja_extensions:
  - jinja2_time.TimeExtension

_answers_file: .copier-answers.yml

# ---------------------------------------------------------------------------
# The technology comes first: every later question and generated file follows it

platform:
  type: str
  choices:
    - arduino
    - avr
    - esp
    - stm32
  default: arduino
  help: "Target platform: Arduino framework, bare AVR, ESP, or STM32"

# ---------------------------------------------------------------------------
# Arduino

arduino_board:
  type: str
  choices:
    - uno
    - nano
    - mega2560
    - leonardo
    - other
  default: uno
  when: "{{ platform == 'arduino' }}"
  help: "Arduino board"

arduino_board_custom:
  type: str
  default: ""
  when: "{{ platform == 'arduino' and arduino_board == 'other' }}"
  help: "PlatformIO board id of the board"
  validator: "{% if not arduino_board_custom %}A PlatformIO board id is required for 'other'{% endif %}"

arduino_bootloader:
  type: str
  choices:
    - old
    - new
  default: old
  when: "{{ platform == 'arduino' and arduino_board == 'nano' }}"
  help: "Nano bootloader: old (57600 baud) or new (115200 baud)"

arduino_libraries:
  type: str
  choices:
    - "No"
    - "Yes"
  default: "No"
  when: "{{ platform == 'arduino' }}"
  help: "Yes adds lib/vendor/ for project-local Arduino libraries and their rows in lib/README.md"

arduino_sketch_link:
  type: str
  choices:
    - "Yes"
    - "No"
  default: "No"
  when: "{{ platform == 'arduino' }}"
  help: "Yes places a root <repo>.ino symlink to the sketch in src/"

# ---------------------------------------------------------------------------
# Bare AVR

avr_language:
  type: str
  choices:
    - c
    - cpp
    - rust
  default: c
  when: "{{ platform == 'avr' }}"
  help: "Language of the bare AVR project"

avr_mcu:
  type: str
  choices:
    - atmega328p
    - atmega32u4
    - attiny85
    - other
  default: atmega328p
  when: "{{ platform == 'avr' }}"
  help: "AVR microcontroller"

avr_mcu_custom:
  type: str
  default: ""
  when: "{{ platform == 'avr' and avr_mcu == 'other' }}"
  help: "PlatformIO board id, or the MCU name for Rust"
  validator: "{% if not avr_mcu_custom %}A board id is required for 'other'{% endif %}"

avr_clock:
  type: str
  choices:
    - "16000000"
    - "8000000"
  default: "16000000"
  when: "{{ platform == 'avr' }}"
  help: "CPU clock in Hz"

avr_programmer:
  type: str
  choices:
    - usbasp
    - arduino-isp
  default: usbasp
  when: "{{ platform == 'avr' }}"
  help: "Upload programmer: USBasp, or an Arduino running ArduinoISP"

# ---------------------------------------------------------------------------
# ESP

esp_chip:
  type: str
  choices:
    - esp32
    - esp8266
  default: esp32
  when: "{{ platform == 'esp' }}"
  help: "ESP chip"

esp_framework:
  type: str
  choices: "{{ ['espidf', 'arduino'] if esp_chip == 'esp32' else ['arduino', 'esp8266-rtos-sdk'] }}"
  default: "{{ 'espidf' if esp_chip == 'esp32' else 'arduino' }}"
  when: "{{ platform == 'esp' }}"
  help: "Framework: ESP-IDF, Arduino, or the ESP8266 RTOS SDK"

esp_board:
  type: str
  choices: "{{ ['esp32dev', 'esp32doit-devkit-v1'] if esp_chip == 'esp32' else ['nodemcuv2', 'd1_mini'] }}"
  default: "{{ 'esp32dev' if esp_chip == 'esp32' else 'nodemcuv2' }}"
  when: "{{ platform == 'esp' }}"
  help: "PlatformIO board"

# ---------------------------------------------------------------------------
# STM32

stm32_toolchain:
  type: str
  choices:
    - rust
    - platformio
  default: rust
  when: "{{ platform == 'stm32' }}"
  help: "Rust embedded, or PlatformIO with CMSIS/Arduino"

stm32_board:
  type: str
  choices:
    - f405rg
    - f103c8
    - f411re
    - l476rg
  default: f405rg
  when: "{{ platform == 'stm32' }}"
  help: "STM32 board family"

stm32_framework:
  type: str
  choices:
    - stm32cube
    - arduino
  default: stm32cube
  when: "{{ platform == 'stm32' and stm32_toolchain == 'platformio' }}"
  help: "PlatformIO framework: STM32Cube HAL, or Arduino"

stm32_upload:
  type: str
  choices:
    - stlink
    - serial
  default: "{{ 'serial' if stm32_board == 'f405rg' else 'stlink' }}"
  when: "{{ platform == 'stm32' and stm32_toolchain == 'platformio' }}"
  help: "Upload over ST-Link, or over the serial bootloader with stm32flash"

# ---------------------------------------------------------------------------
# Common questions

author_name:
  type: str
  default: ""
  help: "Author name, optionally with the email: `Konrad Jelen <konrad.jelen@gmail.com>` or `Konrad Jelen konrad.jelen@gmail.com`"
  placeholder: "Your name <you@example.com>"

description:
  type: str
  default: ""
  help: "One line about the firmware"
  placeholder: "A short description of the project"

open_source_license:
  type: str
  choices:
    - Apache-2.0
    - MIT
    - No license file
  default: MIT
  help: "License of the generated project"

git_init:
  type: str
  choices:
    - "Yes"
    - "No"
  default: "Yes"
  help: "Initialize a git repository with the main branch"

environment_scope:
  type: str
  choices:
    - global
    - local
  default: global
  help: "Install the conda environment in the conda root (global) or under the project (local)"

# Copier renders a default only from the answers above it, and the default of host_module reads
# repo_name, so the two names are derived here, before the host-side questions.
project_name:
  type: str
  default: "{{ _copier_conf.dst_path.name }}"
  ask: false

repo_name:
  type: str
  default: "{{ project_name.lower().replace(' ', '-') }}"
  ask: false

host_side:
  type: str
  choices:
    - "No"
    - "Yes"
  default: "No"
  help: "Generate host-side code: a Python package under host/ that talks to the board over serial"

host_module:
  type: str
  default: "{{ repo_name.replace('-', '') }}_host"
  when: "{{ host_side == 'Yes' }}"
  help: "Python module name of the host-side code"
  validator: "{% if not host_module.isidentifier() %}host_module must be a Python identifier, for example weatherstation_host{% endif %}"

# ---------------------------------------------------------------------------
# Optional folders and files, chosen together

components:
  type: str
  multiselect: true
  choices:
    - notebooks
    - resources
    - references
    - data
    - simulator
    - ltspice
    - docs
    - ci
    - agents
    - env-installers
  default:
    - notebooks
    - resources
    - references
    - simulator
    - agents
    - env-installers
  help: "Optional folders: notebooks, resources, references, data, simulator, docs, CI, AI-agent support, environment installers"

# ---------------------------------------------------------------------------
# Derived answers, never asked

# The author is split into the name and the email address: both forms `Name <email>` and
# `Name email`, in any position, give the same pair. The full name keeps every token that is
# not an email address.
author_email:
  type: str
  default: >-
    {%- set found = namespace(value='') -%}
    {%- for part in author_name.replace('<', ' ').replace('>', ' ').replace(',', ' ').split() -%}
    {%- if '@' in part and '.' in part -%}{%- set found.value = part -%}{%- endif -%}
    {%- endfor -%}
    {{ found.value }}
  when: false

author_name_clean:
  type: str
  default: >-
    {%- set parts = [] -%}
    {%- for part in author_name.replace('<', ' ').replace('>', ' ').replace(',', ' ').split() -%}
    {%- if not ('@' in part and '.' in part) -%}{%- set _ = parts.append(part) -%}{%- endif -%}
    {%- endfor -%}
    {{ parts | join(' ') }}
  when: false

author_first_name:
  type: str
  default: >-
    {%- set parts = author_name_clean.split() -%}
    {{ parts[0] if parts else '' }}
  when: false

author_last_name:
  type: str
  default: "{{ author_name_clean.split()[1:] | join(' ') }}"
  when: false

serial_baud:
  type: str
  default: "{{ '9600' if platform in ['arduino', 'avr'] else '115200' }}"
  when: false

env_name:
  type: str
  default: >-
    {%- if platform == 'stm32' -%}firmware-stm32
    {%- elif platform in ['arduino', 'avr'] -%}firmware-avr
    {%- else -%}firmware-esp
    {%- endif -%}
  when: false

env_local:
  type: str
  default: "{{ '1' if environment_scope == 'local' else '' }}"
  when: false

toolchain_language:
  type: str
  default: >-
    {%- if (platform == 'avr' and avr_language == 'rust') or (platform == 'stm32' and stm32_toolchain == 'rust') -%}rust
    {%- elif platform == 'avr' and avr_language == 'cpp' -%}cpp
    {%- elif platform == 'arduino' -%}cpp
    {%- elif platform == 'esp' and esp_framework == 'arduino' -%}cpp
    {%- elif platform == 'stm32' and stm32_toolchain == 'platformio' and stm32_framework == 'arduino' -%}cpp
    {%- else -%}c{%- endif -%}
  when: false

crate_name:
  type: str
  default: "{{ repo_name.replace('-', '_') }}"
  when: false

avr_target:
  type: str
  default: avr-none
  when: false

avr_cpu:
  type: str
  default: >-
    {%- if platform == 'avr' -%}
    {{ avr_mcu_custom if avr_mcu == 'other' else avr_mcu }}
    {%- endif -%}
  when: false

pio_platform:
  type: str
  default: >-
    {%- if platform == 'arduino' or (platform == 'avr' and avr_language != 'rust') -%}atmelavr@5.3.0
    {%- elif platform == 'esp' -%}{{ 'espressif32@7.1.3' if esp_chip == 'esp32' else 'espressif8266@4.2.1' }}
    {%- elif platform == 'stm32' and stm32_toolchain == 'platformio' -%}ststm32@20.0.0
    {%- endif -%}
  when: false

pio_board:
  type: str
  default: >-
    {%- if platform == 'arduino' -%}
    {%- if arduino_board == 'uno' -%}uno
    {%- elif arduino_board == 'nano' -%}{{ 'nanoatmega328new' if arduino_bootloader == 'new' else 'nanoatmega328' }}
    {%- elif arduino_board == 'mega2560' -%}megaatmega2560
    {%- elif arduino_board == 'leonardo' -%}leonardo
    {%- else -%}{{ arduino_board_custom }}{%- endif -%}
    {%- elif platform == 'avr' and avr_language != 'rust' -%}
    {%- if avr_mcu == 'atmega328p' -%}{{ 'pro8MHzatmega328' if avr_clock == '8000000' else 'uno' }}
    {%- elif avr_mcu == 'atmega32u4' -%}leonardo
    {%- elif avr_mcu == 'attiny85' -%}attiny85
    {%- else -%}{{ avr_mcu_custom }}{%- endif -%}
    {%- elif platform == 'esp' -%}{{ esp_board }}
    {%- elif platform == 'stm32' and stm32_toolchain == 'platformio' -%}{{ {'f405rg': 'genericSTM32F405RG', 'f103c8': 'bluepill_f103c8', 'f411re': 'nucleo_f411re', 'l476rg': 'nucleo_l476rg'}[stm32_board] }}
    {%- endif -%}
  when: false

pio_framework:
  type: str
  default: >-
    {%- if platform == 'arduino' -%}arduino
    {%- elif platform == 'avr' -%}
    {%- elif platform == 'esp' -%}{{ esp_framework }}
    {%- elif platform == 'stm32' and stm32_toolchain == 'platformio' -%}{{ stm32_framework }}
    {%- endif -%}
  when: false

pio_upload_protocol:
  type: str
  default: >-
    {%- if platform == 'avr' and avr_language != 'rust' -%}{{ 'arduinoisp' if avr_programmer == 'arduino-isp' else 'usbasp' }}
    {%- elif platform == 'stm32' and stm32_toolchain == 'platformio' -%}{{ 'serial' if stm32_upload == 'serial' else 'stlink' }}
    {%- endif -%}
  when: false

thumb_target:
  type: str
  default: >-
    {%- if platform == 'stm32' -%}
    {{ 'thumbv7m-none-eabi' if stm32_board == 'f103c8' else 'thumbv7em-none-eabihf' }}
    {%- endif -%}
  when: false

flash_kb:
  type: str
  default: >-
    {%- if platform == 'stm32' -%}
    {{ {'f405rg': '1024', 'f103c8': '64', 'f411re': '512', 'l476rg': '1024'}[stm32_board] }}
    {%- endif -%}
  when: false

ram_kb:
  type: str
  default: >-
    {%- if platform == 'stm32' -%}
    {{ {'f405rg': '128', 'f103c8': '20', 'f411re': '128', 'l476rg': '128'}[stm32_board] }}
    {%- endif -%}
  when: false

# ---------------------------------------------------------------------------

_exclude:
  - copier.yml
  - "*.pyc"
  - __pycache__
  - .git

_skip_if_exists:
  - README.md
  - CHANGELOG.md
  - VERSION
  - RELEASING.md
  - AGENTS.md
  - CLAUDE.md
  - docs/README.md
  - notebooks/README.md
  - resources/README.md
  - references/README.md
  - data/README.md
  - resources/envs/
  - .gitignore
  - pytest.ini
  - test/
  - host/
  - notebooks/
  - resources/
  - references/
  - simulations/
  - data/
  - docs/
  - .github/
  - .agents/
  - .claude/

_tasks:
  - >-
    python3 "{{ _copier_conf.src_path }}/scripts/post_gen.py"
    --project-name "{{ project_name }}"
    --repo-name "{{ repo_name }}"
    --platform "{{ platform }}"
    --avr-language "{{ avr_language | default('') }}"
    --esp-framework "{{ esp_framework | default('') }}"
    --components "{{ components | join(',') }}"
    --stm32-toolchain "{{ stm32_toolchain | default('') }}"
    --stm32-framework "{{ stm32_framework | default('') }}"
    --arduino-libraries "{{ arduino_libraries | default('No') }}"
    --arduino-sketch-link "{{ arduino_sketch_link | default('No') }}"
    --open-source-license "{{ open_source_license }}"
    --git-init "{{ git_init }}"
    --host-side "{{ host_side }}"
    --copier-operation "{{ _copier_operation }}"

# 1.0.14 renders scripts/ and simulations/ in place of tools/ and ltspice/. Copier deletes every
# file the old version rendered into a folder the new version no longer renders, edited or not, so
# the update from an older version first moves both folders with git mv. A string command runs
# through the shell; the migration runs only when the old version is below 1.0.14 and the new one
# is 1.0.14 or later.
_migrations:
  - version: "1.0.14"
    when: "{{ _stage == 'before' }}"
    command: >-
      if { [ -d ltspice ] && [ -e simulations ]; } || { [ -d tools ] && [ -e scripts ]; }; then
      echo "copier update to 1.0.14 moves tools/ to scripts/ and ltspice/ to simulations/; rename your own scripts/ or simulations/ folder, commit, and run the update again" >&2; exit 1; fi;
      if [ -d ltspice ]; then git mv ltspice simulations; fi;
      if [ -d tools ]; then git mv tools scripts; fi
