[project]
name = "copier-embedded-project"
version = "1.0.14"
description = "Copier template for embedded firmware projects: Arduino, bare AVR, ESP and STM32, with one unified structure and opt-in components"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Konrad Jelen", email = "konrad.jelen@gmail.com" },
]
keywords = ["copier", "template", "embedded", "firmware", "arduino", "avr", "esp32", "stm32", "platformio", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "copier>=9.6",
    "jinja2-time",
    "pytest>=8",
    "pyyaml",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/stellarshenson/copier-embedded-project"
Repository = "https://github.com/stellarshenson/copier-embedded-project"
Issues = "https://github.com/stellarshenson/copier-embedded-project/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "toolchain: needs a conda environment or an emulator installed on this machine",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
