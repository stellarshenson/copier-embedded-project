[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ repo_name }}-host"
version = "0.1.0"
description = "Host-side code of {{ project_name }}: talks to the board over serial"
requires-python = ">=3.10"
dependencies = ["pyserial"]

[tool.setuptools.packages.find]
where = ["src"]
