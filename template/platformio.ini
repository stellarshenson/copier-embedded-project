; PlatformIO project generated by copier-embedded-project
; The platform and board pins match the conda environment installed by `make env`.
{%- if platform == 'esp' and esp_framework == 'espidf' %}
[platformio]
src_dir = main
{%- endif %}

[env:{{ pio_board }}]
platform = {{ pio_platform }}
board = {{ pio_board }}
{%- if pio_framework %}
framework = {{ pio_framework }}
{%- endif %}
monitor_speed = {{ serial_baud }}
{%- if platform == 'avr' %}
upload_protocol = {{ pio_upload_protocol }}
board_build.f_cpu = {{ avr_clock }}L
{%- endif %}
{%- if platform == 'stm32' and stm32_toolchain == 'platformio' %}
upload_protocol = {{ pio_upload_protocol }}
{%- endif %}
{%- if platform == 'stm32' and stm32_toolchain == 'platformio' and stm32_framework == 'stm32cube' %}
extra_scripts = pre:tools/freertos.py
{%- endif %}
{%- if platform == 'esp' and esp_framework == 'espidf' %}
board_build.flash_mode = dio
{%- endif %}
